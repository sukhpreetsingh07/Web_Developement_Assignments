<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>GLA University - Photo Gallery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
     
            background-color: #ffffff;
            color: #333333;
        }

        header {
            background-color: #0f233f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 50px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 100%;
            height: 100%;
            background-color: #d4a359;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f233f;
            font-weight: bold;
            font-size: 18px;
        }

        .logo-text {
            color: #ffffff;
            line-height: 1.1;
        }

        .logo-text .main-name {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo-text .sub-name {
            font-size: 11px;
            letter-spacing: 1px;
            color: #e0e0e0;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            padding-bottom: 5px;
            
        }

        nav li.active a {
            border-bottom: 2px solid #d4a359;
            color: #ffffff;
        }

        .main-content {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        .gallery-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .gallery-title span.blue {
            color: #0f233f;
        }

        .gallery-title span.gold {
            color: #d4a359;
        }

        .title-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .title-divider .line {
            height: 1px;
            width: 30px;
            background-color: #d4a359;
        }

        .title-divider .camera-icon {
            width: 22px;
            height: 18px;
            background-color: #d4a359;
            border-radius: 3px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title-divider .camera-icon::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ffffff;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .gallery-card {
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
           
        }

        .gallery-card:hover {
           
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.18);
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
