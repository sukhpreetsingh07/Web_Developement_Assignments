<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie List - Recreated</title>
  
  
  <style>
    
    body {
      background-color: white;
      margin: 0;
      padding: 40px;
    }

    
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    
    .movie-card {
      display: flex;
      align-items: center;
      border: 1px solid pink;
      border-radius: 4px;
      background-color: white;
       height: 140px;
    }

    
    .poster-container {
      width: 140px;
      height: 100%;
      flex-shrink: 0;
      background-color: gray;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .poster-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    
    .movie-details {
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .movie-title {
      font-size: 18px;
      font-weight: bold;
      color: black;
      margin: 0 0 10px 0;
    }

    .release-date {
      font-size: 13px;
      color: black;
      margin: 0 0 15px 0;
    }

    
    .book-btn {
      background-color: red;
      color: white;
      padding: 8px 16px;
      font-size: 12px;
      border-radius: 6px;
      width: fit-content;
    }

    .book-btn:hover {
      background-color: red;
    }
  </style>
</head>
<body>

  
  <div class="movies-grid">

    
    <div class="movie-card">
      <div class="poster-container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRjX9WooYwga7Ux5RfWd9p0Ek-2ryDjzsizpJcDp3Bb5w&s=10" alt="ET (2022)">
      </div>
      <div class="movie-details">
        <h3 class="movie-title">ET (2022)</h3>
        <p class="release-date">Releasing on 11 Mar, 2022</p>
        <button class="book-btn">Book tickets</button>
      </div>
    </div>

    
    <div class="movie-card">
      <div class="poster-container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT02QfShuZT18Y0TLGg8kfIUGFbmCoS4Ss4PTJQp47JYg&s=10" alt="Jhund">
      </div>
      <div class="movie-details">
        <h3 class="movie-title">Jhund</h3>
        <p class="release-date">Releasing on 11 Mar, 2022</p>
        <button class="book-btn">Book tickets</button>
      </div>
    </div>

    
    <div class="movie-card">
      <div class="poster-container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTm-QsrdnX6ySn5zDYPKw_PH8aAT0HJNQ0B9qsHYLuZxg&s=10" alt="Gangubai Kathiawadi">
      </div>
      <div class="movie-details">
        <h3 class="movie-title">Gangubai Kathiawadi</h3>
        <p class="release-date">Releasing on 11 Mar, 2022</p>
        <button class="book-btn">Book tickets</button>
      </div>
    </div>

    
    <div class="movie-card">
      <div class="poster-container">
        <img src="https://i.ytimg.com/vi/ZAP6q_Zv-4g/sddefault.jpg?v=61c473fe" alt="Radhe Shyam">
      </div>
      <div class="movie-details">
        <h3 class="movie-title">Radhe Shyam</h3>
        <p class="release-date">Releasing on 11 Mar, 2022</p>
        <button class="book-btn">Book tickets</button>
      </div>
    </div>

    
    <div class="movie-card">
      <div class="poster-container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBOczDRZruIiK4D1pojtRgXGUqIx5aj7rfPAXVNatoYA&s=10" alt="Uncharted">
      </div>
      <div class="movie-details">
        <h3 class="movie-title">Uncharted</h3>
        <p class="release-date">Releasing on 11 Mar, 2022</p>
        <button class="book-btn">Book tickets</button>
      </div>
    </div>

    
    <div class="movie-card">
      <div class="poster-container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvnJLEStmHylq1CwJdu1X1aycymWcN284Px8X5Gqfzrw&s" alt="The Batman">
      </div>
      <div class="movie-details">

  </div>

</body>
</html>
