<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet Our Mentors</title>
  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      
    }

    body {
      background-color: #ffffff;
      padding: 50px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      text-align: center;
    }

    .header h2 {
      font-size: 28px;
      font-weight: 700;
      color: #000;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
      margin-bottom: 40px;
    }

   

    .card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      border: 1px solid #eaeaea;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .card-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .card-name {
      font-size: 16px;
      font-weight: 700;
      color: #222;
    }

    .card-company {
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .see-more-btn {
      background-color: #e60028;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Meet Our Mentors</h2>
      <p>Being Developers themselves, the Curriculum Team is<br>an experienced group of instructors teaching</p>

        <div class="card-info">
          <div class="card-name">Kanish Aman</div>

            <span style="font-size: 14px; font-weight: 600; color: #2874f0;">Flipkart</span>

        <div class="card-info">

        <div class="card-info">
          <div class="card-name">Mohit Rai</div>

      <div class="card">
