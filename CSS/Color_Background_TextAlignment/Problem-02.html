<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tasty Bites Restaurant</title>

    <style>
       
        body {
            margin: 0;
            padding: 20px;
            background-color: white;
            
        }

    
        .container {
            width: 95%;
            margin: auto;
        }

       
        .header {
            background-color: red;
            color: white;
            text-align: center;
            padding: 2px 0 5px;
        }

        .header h1 {
            font-size: 24px;
            margin: 0 0 12px;
        }

        .header p {
            font-size: 12px;
            margin: 0;
        }

        
        .dishes {
            background-color: #fff8e5;
            margin-top: 14px;
            padding: 2px 0 0;
        }

        .dishes h2 {
            color: #8b0000;
            text-align: center;
            font-size: 18px;
            margin: 0 0 14px;
        }

        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: center;
        }

        th {
            background-color: #ffa500;
            color: white;
            border: 1px solid white;
            padding: 2px;
        }

        td {
            background-color: #fffdf2;
            border: 1px solid #aaa;
            padding: 1px;
        }

      
        .message {
            background-color: #f9dfe7;
            color: #c4161c;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-top: 14px;
            padding: 2px 0;
        }

        .message p {
            margin: 0;
        }

        .footer {
            background-color: #3b2521;
            color: white;
            margin-top: 14px;
            padding: 2px 0;
            font-size: 12px;
        }

        .footer p {
            margin: 3px 0;
        }

        .footer .daily {
            text-align: left;
        }

        .footer .thanks {
            text-align: right;
        }
    </style>
</head>

<body>

    <div class="container">

     
        <header class="header">
            <h1>Tasty Bites Restaurant</h1>
            <p>Good Food Makes a Better Mood</p>
        </header>

      
        <section class="dishes">

            <h2>Our Special Dishes</h2>

            <table>
                <thead>
                    <tr>
                        <th>Dish Name</th>
                        <th>Type</th>
                        <th>Price</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Margherita Pizza</td>
                        <td>Veg</td>
                        <td>₹249</td>
                    </tr>

                    <tr>
                        <td>Paneer Butter Masala</td>
                        <td>Veg</td>
                        <td>₹279</td>
                    </tr>

                    <tr>
                        <td>Chicken Biryani</td>
                        <td>Non-Veg</td>
                        <td>₹299</td>
                    </tr>

                    <tr>
                        <td>Chocolate Brownie</td>
                        <td>Dessert</td>
                        <td>₹149</td>
                    </tr>
                </tbody>
            </table>

        </section>

        
        <section class="message">
            <p>Visit Us & Enjoy Delicious Food!</p>
        </section>

        
        <footer class="footer">

            <p class="daily">Open Daily: 11 AM - 11 PM</p>

            <p class="thanks">Thank You!</p>

        </footer>

    </div>

</body>
</html>
