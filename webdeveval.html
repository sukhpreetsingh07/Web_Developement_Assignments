<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteXL Navbar</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background-color: whitesmoke;
            color: #333;
        }

        
        .container{
            width: 100%;
            background-color: #ffffff;
            border-bottom: 1px solid #eeeeee;
        }

        
        .container1{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            min-height: 78px;
            gap: 25px;
            border-bottom: 1px solid #eeeeee;
        }

     
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #459b60;
            
        }

        
        .main-menu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            flex: 1;
        }

        .main-menu div {
            
            color:black;
            font-size: 15px;
            
        }

        
        .sign-in {
            background-color: #263447;
            color: #ffffff;
            padding: 11px 19px;
            border-radius: 5px;
            font-size: 14px;
        }

    
        .sub-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding: 14px 20px;
        }

        .sub-nav div {
            color: black;
            font-size: 15px;   
        }
 
    </style>
</head>

<body>

    <header class="container">

        <div class="container1">

            <div class="logo">ByteXL</div>

            <div class="main-menu">
                <div>Courses</div>
                <div>Tutorials</div>
                <div>Practice</div>
                <div>Jobs</div>
            </div>

            <div class="sign-in">Sign In</div>

        </div>

        
        <div class="sub-nav">

            <div>DSA</div>
            <div>Practice Problems</div>
            <div>C</div>
            <div>C++</div>
            <div>Java</div>
            <div>Python</div>
            <div>JavaScript</div>
            <div>Data Science</div>
            <div>Machine Learning</div>
            <div>Courses</div>
            <div>Linux</div>
            <div>DevOps</div>

        </div>

    </header>

</body>
</html>
